<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form id="reviewForm" method="get" action="review.html">

            <!-- Nombre del producto -->
            <label for="productName">Product Name:</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a product...</option>
            </select>

            <!-- Calificación general -->
            <fieldset>
                <legend>Overall Rating:</legend>
                <label><input type="radio" name="rating" value="1" required> ☆</label>
                <label><input type="radio" name="rating" value="2"> ☆☆</label>
                <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
            </fieldset>

            <!-- Fecha de instalación -->
            <label for="installDate">Installation Date:</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Características útiles -->
            <fieldset>
                <legend>Useful Features:</legend>
                <label><input type="checkbox" name="features" value="feature1"> Feature 1</label>
                <label><input type="checkbox" name="features" value="feature2"> Feature 2</label>
                <label><input type="checkbox" name="features" value="feature3"> Feature 3</label>
            </fieldset>

            <!-- Reseña escrita -->
            <label for="reviewText">Write a Review (optional):</label>
            <textarea id="reviewText" name="reviewText" rows="4"></textarea>

            <!-- Nombre de usuario -->
            <label for="username">Your Name (optional):</label>
            <input type="text" id="username" name="username">

            <!-- Botón de envío -->
            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>© 2025 Eduardo Amador – Dominican Republic</p>
        <p id="lastModified"></p>
    </footer>

        <script>
            document.getElementById('lastModified').textContent = "Last modified: " + document.lastModified;
        </script>

    <script src="scripts/form.js"></script>
</body>

</html>
